name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        # Non-secret config — set as GitHub repo *Variables* (Settings → Secrets and variables → Actions → Variables).
        # All optional; site builds fine without them.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_ADS_ID: ${{ vars.PUBLIC_ADS_ID }}
          PUBLIC_ADS_LABEL: ${{ vars.PUBLIC_ADS_LABEL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=landing2 --branch=main
